<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quark Web</title>
<style>
  body {
    font-family: monospace;
    background-color: #1e1e1e;
    color: #f5f5f5;
    padding: 20px;
  }
  .quark-section {
    margin-bottom: 12px;
  }
  .quark-label {
    font-weight: bold;
  }
  .reroll-btn {
    margin-left: 8px;
    cursor: pointer;
    background: #333;
    color: #f5f5f5;
    border: none;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .quark-color {
    display: inline-block;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="quark-section">
  <span class="quark-label"></span>
  <span id="color" class="quark-color"></span>
  <button class="reroll-btn" onclick="rerollColor()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Card:</span> <span id="card"></span>
  <button class="reroll-btn" onclick="rerollCard()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Sensory:</span> <span id="sensory"></span>
  <button class="reroll-btn" onclick="rerollSensory()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Emoji:</span> <span id="emoji"></span>
  <button class="reroll-btn" onclick="rerollEmoji()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Tone–Genre:</span> <span id="genre"></span>
  <button class="reroll-btn" onclick="rerollGenre()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Chord Progression:</span> <span id="chords"></span>
  <button class="reroll-btn" onclick="rerollChord()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">BPM:</span> <span id="bpm"></span>
  <button class="reroll-btn" onclick="rerollBPM()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Time Signature:</span> <span id="time"></span>
  <button class="reroll-btn" onclick="rerollTime()">↻</button>
</div>

<div class="quark-section">
  <span class="quark-label">Rhythm:</span> <span id="rhythm"></span>
  <button class="reroll-btn" onclick="rerollRhythm()">↻</button>
</div>

<script>
const cardsURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/cards.json";
const texturesURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/textures.json";
const emojisURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/emojis.json";
const genresURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/genres.json";
const chordsURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/chords.json";

// --- Seedable PRNG like Go's ---
function xoshiro128ss(seed) {
  let s = [seed, seed ^ 0x6a09e667, seed ^ 0xbb67ae85, seed ^ 0x3c6ef372];

  function rotl(x, k) {
    return (x << k) | (x >>> (32 - k));
  }

  return function() {
    const result = rotl(s[0] + s[3], 7) + s[0];
    const t = s[1] << 9;
    s[2] ^= s[0];
    s[3] ^= s[1];
    s[1] ^= s[2];
    s[0] ^= s[3];
    s[2] ^= t;
    s[3] = rotl(s[3], 11);
    return (result >>> 0) / 0x100000000;
  }
}

// Create a generator seeded by current time
const seed = Date.now() & 0xffffffff;
const rand = xoshiro128ss(seed);

let quarkData = { card: [], sensory: [], emoji: [], genre: [], chord: [] };
let timeSigs = ["4/4","3/4","6/8","5/4","3/8","5/8","6/4","7/8","7/4","9/4","10/4","10/8","11/4","11/8","13/4","13/8","14/4","14/8","15/4","15/8"];
let chordProg = [], rhythm = [], currentTimeSig = "", bpm = 120;
let color = { r: 0, g: 0, b: 0 };

async function loadJSON() {
  const urls = { card: cardsURL, sensory: texturesURL, emoji: emojisURL, genre: genresURL, chord: chordsURL };
  for (const key in urls) {
    try {
      const res = await fetch(urls[key]);
      if (!res.ok) throw new Error("Fetch failed");
      quarkData[key] = await res.json();
    } catch(e) {
      console.error(`${key} load error:`, e);
      quarkData[key] = [`Error loading JSON`];
    }
  }
}

function pickRandom(arr) {
  return arr[Math.floor(rand() * arr.length)];
}

function generateChordProg() {
  chordProg = [];
  for (let i = 0; i < 4; i++) {
    chordProg.push(pickRandom(quarkData.chord));
    if (i < 3) chordProg.push("=>");
  }
}

function generateBPM() {
  bpm = 40 + Math.floor(rand() * 160);
  let rng = Math.floor(rand() * 10);
  if (bpm <= 100 && rng >= 3) bpm += Math.floor(rand() * 55) + 25;
  if (bpm >= 150 && rng >= 3) bpm -= Math.floor(rand() * 55) + 25;
}

function generateColor() {
  color.r = Math.floor(rand() * 256);
  color.g = Math.floor(rand() * 256);
  color.b = Math.floor(rand() * 256);
}

function generateTime() {
  currentTimeSig = pickRandom(timeSigs);
}

function generateRhythm() {
  rhythm = [];
  let count = parseInt(currentTimeSig.split("/")[0]);
  let xCount = 0;
  for (let i = 0; i < count; i++) {
    if (rand() > 0.5) { rhythm.push("x"); xCount++; }
    else rhythm.push("-");
  }
  if (xCount === 0 && rhythm.length > 0) rhythm[rhythm.length-1] = "x";
}

function renderQuark() {
  generateColor(); // ensure color rerolls with full set

  document.getElementById('color').textContent = "QUARK";
  document.getElementById('color').style.color = `rgb(${color.r},${color.g},${color.b})`;

  document.getElementById('card').textContent = pickRandom(quarkData.card);
  document.getElementById('sensory').textContent = pickRandom(quarkData.sensory);
  document.getElementById('emoji').textContent = pickRandom(quarkData.emoji);
  document.getElementById('genre').textContent = pickRandom(quarkData.genre);

  generateChordProg();
  document.getElementById('chords').textContent = chordProg.join(' ');

  generateBPM();
  document.getElementById('bpm').textContent = bpm;

  generateTime();
  document.getElementById('time').textContent = currentTimeSig;

  generateRhythm();
  document.getElementById('rhythm').textContent = rhythm.join(' ');
}

// Reroll functions
function rerollCard(){ document.getElementById('card').textContent = pickRandom(quarkData.card); }
function rerollSensory(){ document.getElementById('sensory').textContent = pickRandom(quarkData.sensory); }
function rerollEmoji(){ document.getElementById('emoji').textContent = pickRandom(quarkData.emoji); }
function rerollGenre(){ document.getElementById('genre').textContent = pickRandom(quarkData.genre); }
function rerollChord(){ generateChordProg(); document.getElementById('chords').textContent = chordProg.join(' '); }
function rerollBPM(){ generateBPM(); document.getElementById('bpm').textContent = bpm; }
function rerollTime(){ generateTime(); generateRhythm(); document.getElementById('time').textContent = currentTimeSig; document.getElementById('rhythm').textContent = rhythm.join(' '); }
function rerollRhythm(){ generateRhythm(); document.getElementById('rhythm').textContent = rhythm.join(' '); }
function rerollColor(){ generateColor(); document.getElementById('color').style.color = `rgb(${color.r},${color.g},${color.b})`; }

loadJSON().then(() => {
  generateColor();
  renderQuark();
});

document.addEventListener("keydown", (e) => {
  switch(e.key) {
    case "1": rerollCard(); break;
    case "2": rerollSensory(); break;
    case "3": rerollEmoji(); break;
    case "4": rerollGenre(); break;
    case "5": rerollChord(); break;
    case "6": rerollBPM(); break;
    case "7": rerollTime(); break;
    case "8": rerollRhythm(); break;
    case "9": rerollColor(); break;
    case "n": renderQuark(); break;
    case "q":
    case "e":
      window.close(); // simulates exit
      break;
    default:
      console.log("Press 1-9 for rerolls, n for new set, q/e to exit");
  }
});
</script>
</body>
</html>
