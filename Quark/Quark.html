<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUARK</title>
    <link rel="shortcut icon" type="image/x-icon" href="Quark.ico" />
    <style>
        @font-face {
            font-family: "Mononoki Nerd";
            src: url("Mononoki/MononokiNerdFont-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: "Mononoki Nerd";
            src: url("Mononoki/MononokiNerdFont-Italic.ttf") format("truetype");
            font-weight: 400;
            font-style: italic;
        }

        @font-face {
            font-family: "Mononoki Nerd";
            src: url("Mononoki/MononokiNerdFont-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: "Mononoki Nerd";
            src: url("Mononoki/MononokiNerdFont-BoldItalic.ttf") format("truetype");
            font-weight: 700;
            font-style: italic;
        }

        /* PREVENT SELECTION AND CONTEXT MENU */
        html, body, div, span, a {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Mononoki Nerd", monospace;
            font-size: clamp(24px, 2vw, 24px);
            padding: 20px;
            color: rgba(250,250,250,0.95);
            background-color: #000;
            position: relative;
            word-break: keep-all;
            overflow-wrap: normal;
            hyphens: none;
            white-space: normal;
        }

        @media (max-width: 768px) {
            * {
                -webkit-text-size-adjust: none;
                text-size-adjust: none;
            }
            
            body {
                overflow-x: hidden;
                max-width: 100vw;
                padding: 10px;
            }

            .quark-section {
                margin-bottom: 16px;
            }
            
            a {
                padding: 4px 2px;
                margin: -4px -2px;
                touch-action: manipulation;
            }

            a:active {
                animation: jiggle 0.3s ease forwards;
                animation-iteration-count: 1;
            }
        }

        @keyframes grow-text {
            from { transform: scale(1);}
            to { transform: scale(1.05); }
        }
        
        a {
            color: rgba(250,250,250,0.95);
            text-decoration: none;
        }
        
        a:hover {
            display: inline-block;
            animation: grow-text 0.2s ease forwards;
        }
        
        @keyframes jiggle {
          0%   { transform: rotate(0deg); scale: 1.15;}
          50%  { transform: rotate(1deg); }
          60%  { transform: rotate(-5deg); }
          75%  { transform: rotate(3deg); }
          100% { transform: rotate(0deg); }
        }
        
        a:active {
            color: rgba(250,250,250,0.95);
            text-decoration: none;
            display: inline-block;
            animation: jiggle 0.5s ease forwards infinite;
        }

        .quark-section {
            margin-bottom: 12px;
        }

        #quark-sketch {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
</style>
</head>

<body onselectstart="return false" oncontextmenu="return false">
    <div id="quark-sketch"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script>
        let cols = 16;
        let rows = 16;
        let noiseOffset = 0;
        let hueBase = 330;
        let hueAmplitude = 8;
        let hueAngle = 0;

        function setup() {
            let cnv = createCanvas(windowWidth, windowHeight);
            cnv.parent('quark-sketch');
            colorMode(HSB, 360, 100, 100, 1);
            noStroke();
        }

        function draw() {
            background(0);
            noiseOffset += 0.005;
            hueAngle += 0.003;

            let currentHue = hueBase + sin(hueAngle) * hueAmplitude;
            let cellW = width / cols;
            let cellH = height / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let n = noise(i * 0.3, j * 0.3, noiseOffset);
                    let brightness = map(n, 0, 1, 5, 50);
                    fill(currentHue, 100, brightness, 0.4);
                    rect(i * cellW, j * cellH, cellW, cellH);
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <div class="quark-section">
        <span class="quark-label"></span>
        <a href="#" onclick="renderQuark();"><span id="color" style="color: #DD0C3D">QUARK</span></a>
    </div>

    <br>

    <div class="quark-section">
        <a href="#" onclick="rerollCard();"><span class="quark-label">Card:</span></a> <span id="card"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollSensory();"><span class="quark-label">Sensory:</span></a> <span id="sensory"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollEmoji();"><span class="quark-label">Emoji:</span></a> <span id="emoji"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollGenre();"><span class="quark-label">Tone–Genre:</span></a> <span id="genre"></span>
    </div>

    <br>

    <div class="quark-section">
        <a href="#" onclick="rerollChord();"><span class="quark-label">Chord Progression:</span></a> <span id="chords"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollBPM();"><span class="quark-label">BPM:</span></a> <span id="bpm"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollTime();"><span class="quark-label">Time Signature:</span></a> <span id="time"></span>
    </div>

    <div class="quark-section">
        <a href="#" onclick="rerollRhythm();"><span class="quark-label">Rhythm:</span></a> <span id="rhythm"></span>
    </div>

    <script>
        const cardsURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/cards.json";
        const texturesURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/textures.json";
        const emojisURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/emojis.json";
        const genresURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/genres.json";
        const chordsURL = "https://raw.githubusercontent.com/raineivyaeera/Quark/main/chords.json";

        function goRand(seed) {
            let s = BigInt(seed) & ((1n << 63n) - 1n);
            const mask = (1n << 63n) - 1n;
            const a = 6364136223846793005n;
            const c = 1n;

            function next63() {
                s = (s * a + c) & mask;
                return s;
            }

            function Int63() {
                return next63();
            }

            function Float64() {
                const val = Int63() >> 10n;
                return Number(val) / 0x20000000000000;
            }

            function Intn(n) {
                if (n <= 0) throw new Error("invalid argument to Intn");
                const bigN = BigInt(n);
                while (true) {
                    let v = Int63();
                    let m = v % bigN;
                    if (v - m + (bigN - 1n) >= 0n) return Number(m);
                }
            }

            return {
                Seed: (newSeed) => { s = BigInt(newSeed) & mask; },
                Int63,
                Float64,
                Intn
            };
        }

        const seed = Date.now() & 0x7fffffff;
        const rand = goRand(seed);

        let quarkData = { card: [], sensory: [], emoji: [], genre: [], chord: [] };
        let timeSigs = ["4/4","3/4","6/8","5/4","3/8","5/8","6/4","7/8","7/4","9/4","10/4","10/8","11/4","11/8","13/4","13/8","14/4","14/8","15/4","15/8"];
        let chordProg = [], rhythm = [], currentTimeSig = "", bpm = 120;
        let color = { r: 0, g: 0, b: 0 };

        async function loadJSON() {
            const urls = { card: cardsURL, sensory: texturesURL, emoji: emojisURL, genre: genresURL, chord: chordsURL };
            for (const key in urls) {
                try {
                    const res = await fetch(urls[key]);
                    if (!res.ok) throw new Error("Fetch failed");
                    quarkData[key] = await res.json();
                } catch(e) {
                    console.error(`${key} load error:`, e);
                    quarkData[key] = ["Error loading JSON"];
                }
            }
        }

        function pickRandom(arr) {
            return arr[rand.Intn(arr.length)];
        }

        function generateChordProg() {
            chordProg = [];
            for (let i = 0; i < 4; i++) {
                chordProg.push(pickRandom(quarkData.chord));
                if (i < 3) chordProg.push("=>");
            }
        }

        function generateBPM() {
            bpm = 40 + rand.Intn(160);
            let rng = rand.Intn(10);
            if (bpm <= 100 && rng >= 3) bpm += rand.Intn(55) + 25;
            if (bpm >= 150 && rng >= 3) bpm -= rand.Intn(55) + 25;
        }

        function generateColor() {
            color.r = rand.Intn(256);
            color.g = rand.Intn(256);
            color.b = rand.Intn(256);
        }

        function generateTime() {
            currentTimeSig = pickRandom(timeSigs);
        }

        function generateRhythm() {
            rhythm = [];
            let count = parseInt(currentTimeSig.split("/")[0]);
            let xCount = 0;
            for (let i = 0; i < count; i++) {
                if (rand.Float64() > 0.5) { rhythm.push("x"); xCount++; }
                else rhythm.push("-");
            }
            if (xCount === 0 && rhythm.length > 0) rhythm[rhythm.length-1] = "x";
        }

        function renderQuark() {
            generateColor();
            document.getElementById('card').textContent = pickRandom(quarkData.card);
            document.getElementById('sensory').textContent = pickRandom(quarkData.sensory);
            document.getElementById('emoji').textContent = pickRandom(quarkData.emoji);
            document.getElementById('genre').textContent = pickRandom(quarkData.genre);

            generateChordProg();
            document.getElementById('chords').textContent = chordProg.join(' ');

            generateBPM();
            document.getElementById('bpm').textContent = bpm;

            generateTime();
            document.getElementById('time').textContent = currentTimeSig;

            generateRhythm();
            document.getElementById('rhythm').textContent = rhythm.join(' ');
        }

        function rerollCard() { document.getElementById('card').textContent = pickRandom(quarkData.card); }
        function rerollSensory() { document.getElementById('sensory').textContent = pickRandom(quarkData.sensory); }
        function rerollEmoji() { document.getElementById('emoji').textContent = pickRandom(quarkData.emoji); }
        function rerollGenre() { document.getElementById('genre').textContent = pickRandom(quarkData.genre); }
        function rerollChord() { generateChordProg(); document.getElementById('chords').textContent = chordProg.join(' '); }
        function rerollBPM() { generateBPM(); document.getElementById('bpm').textContent = bpm; }
        function rerollTime() { generateTime(); generateRhythm(); document.getElementById('time').textContent = currentTimeSig; document.getElementById('rhythm').textContent = rhythm.join(' '); }
        function rerollRhythm() { generateRhythm(); document.getElementById('rhythm').textContent = rhythm.join(' '); }

        loadJSON().then(() => {
            generateColor();
            renderQuark();
        });

        document.addEventListener("keydown", (e) => {
            switch(e.key) {
                case "1": rerollCard(); break;
                case "2": rerollSensory(); break;
                case "3": rerollEmoji(); break;
                case "4": rerollGenre(); break;
                case "5": rerollChord(); break;
                case "6": rerollBPM(); break;
                case "7": rerollTime(); break;
                case "8": rerollRhythm(); break;
                case "n": renderQuark(); break;
                case "r": renderQuark(); break;
                default: console.log("Press 1-9 for rerolls, n/r for new set");
            }
        });
    </script>
</body>
</html>
